name: Build NeoDyn

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build VST3
        shell: bash
        run: cmake --build build --config Release --target NeoDyn_VST3 --parallel

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NeoDyn-VST3-${{ matrix.os }}
          path: build/NeoDyn_artefacts/Release/VST3/
